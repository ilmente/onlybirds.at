title: Home
icon: home

options:
  changeSlug: false
  changeStatus: false
  changeTemplate: false
  changeTitle: false
  delete: false
  duplicate: false
  move: false

tabs:
  hero:
    label: Hero
    icon: image
    fields:
      hero_eyebrow:
        label: Eyebrow
        type: text
        help: Small mono line above the headline, e.g. the regions you guide in.
      hero_title:
        label: Headline
        type: writer
        inline: true
        marks:
          - italic
        help: Italic text is shown in gold. Shift+Enter inserts a line break.
      hero_intro:
        label: Intro
        type: textarea
        buttons: false
        size: small
      hero_cta_primary:
        label: Primary button
        type: text
        width: 1/2
        help: Scrolls to the excursions section. Leave empty to hide the button.
      hero_cta_secondary:
        label: Secondary button
        type: text
        width: 1/2
        help: Scrolls to the contact section. Leave empty to hide the button.

  excursions:
    label: Excursions
    icon: calendar
    columns:
      main:
        width: 2/3
        sections:
          excursions_fields:
            type: fields
            fields:
              excursions_heading:
                label: Section heading
                type: text
              featured_tour:
                label: Featured tour
                type: pages
                query: page.children.listed
                multiple: false
                max: 1
                translate: false
                empty: Automatic – the published tour with the latest start date
                help: The featured tour fills the large card at the top of the section; all other published tours are shown as cards below it.
          tours:
            type: pages
            label: Tours
            status: listed
            template: tour
            layout: list
            image:
              query: page.poster
              cover: true
              back: pattern
            text: "{{ page.title }}"
            info: "{{ page.dates }}"
            empty: No published tours – the excursions section is hidden.
            help: Drag to change the order of the cards. Every tour has the same fields, an image and a PDF.
      sidebar:
        width: 1/3
        sections:
          tour_drafts:
            type: pages
            label: Unpublished tours
            status: draft
            template: tour
            layout: list
            image:
              query: page.poster
              cover: true
              back: pattern
            empty: No drafts.
            help: Drafts are not shown on the site. Publish a tour by changing its status.

  about:
    label: About
    icon: user
    columns:
      main:
        width: 2/3
        fields:
          about_heading:
            label: Section heading
            type: text
          about_lead:
            label: Lead
            type: text
            help: Large serif sentence at the top of the section.
          about_text:
            label: Text
            type: writer
            nodes: false
            marks:
              - bold
              - italic
              - link
      sidebar:
        width: 1/3
        fields:
          about_portrait:
            extends: fields/image
            label: Portrait
            help: Shown at 4:5. Uploaded once for all languages; click the image to edit its alternative text per language.
          about_caption:
            label: Portrait caption
            type: text

  gallery:
    label: Gallery
    icon: images
    columns:
      main:
        width: 2/3
        sections:
          gallery_fields:
            type: fields
            fields:
              gallery_heading:
                label: Section heading
                type: text
              gallery_images:
                label: Plates
                type: files
                multiple: true
                max: 8
                layout: cards
                size: small
                image:
                  cover: true
                  ratio: 3/4
                query: page.files.filterBy("template", "plate")
                uploads:
                  template: plate
                translate: false
                empty: No plates selected – the gallery section is hidden.
                help: Choose up to 8 plates and drag them into order. Click a plate to edit its bird name and scientific name.
              gallery_note:
                label: Note under the grid
                type: text
                help: Optional small mono line below the plates.
      sidebar:
        width: 1/3
        sections:
          plates:
            type: files
            label: Plate library
            template: plate
            layout: list
            image:
              cover: true
              ratio: 3/4
            text: "{{ file.bird }}"
            info: "{{ file.latin }}"
            empty: No plates uploaded yet.

  contact:
    label: Contact
    icon: email
    fields:
      contact_heading:
        label: Heading
        type: writer
        inline: true
        marks:
          - italic
        help: Italic text is shown in gold.
      contact_email:
        label: Email
        type: email
        width: 1/2
        translate: false
      contact_phone:
        label: Phone
        type: tel
        width: 1/2
        translate: false
        help: Shown as typed; the link strips spaces automatically.

  seo:
    label: SEO
    icon: globe
    fields:
      meta_title:
        label: Meta title
        type: text
        maxlength: 70
        help: Browser tab and search result title. Falls back to the site title and tagline.
      meta_description:
        label: Meta description
        type: textarea
        buttons: false
        size: small
        maxlength: 160
        help: Falls back to the default meta description of the site.
