title: Site
icon: home

columns:
  pages:
    width: 1/3
    sections:
      pages:
        type: pages
        label: Pages
        templates:
          - home
        create: false
        layout: cards
        size: large
        image:
          query: page.images.template("plate").first
          cover: true
          ratio: 4/3
          back: pattern
        info: "{{ page.template }}"

  settings:
    width: 2/3
    sections:
      brand:
        type: fields
        fields:
          brand_info:
            type: info
            label: Brand name
            text: The brand name shown in the header is the site title. Change it with the title button at the top of this page (per language).
            theme: none
          tagline:
            label: Brand tagline
            type: text
            help: Small caps line under the brand name in the header.
          footer_copyright:
            label: Footer copyright
            type: text
            translate: false
            help: "Use {{ year }} to insert the current year automatically."
          footer_tagline:
            label: Footer tagline
            type: text

      metadata:
        type: fields
        label: Metadata
        fields:
          meta_description:
            label: Meta description
            type: textarea
            buttons: false
            size: small
            maxlength: 160
            width: 1/2
            help: Shown under the title in search results and link previews (WhatsApp, Facebook, …), per language. A page's own meta description (Home → SEO) takes precedence.
          share_image:
            label: Share image
            type: files
            query: site.images
            uploads: image
            multiple: false
            layout: cards
            image:
              cover: true
              ratio: 1200/630
            translate: false
            width: 1/2
            empty: No share image yet – upload or pick one.
            help: The picture in link previews, cropped to 1200×630 px (set the focus point on the image to choose the crop). One image for all languages; without one, the theme's own image with the logo is used.
